services:
  - type: web
    name: smart-hr-management-system-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smarthr-backend-1.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
